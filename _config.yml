# Site settings. Restart `bundle exec jekyll serve` after editing this file.
# title, tagline, description, and author.name are used for page titles, search results, and
# link previews (jekyll-seo-tag). Jekyll cannot read them from _data, so they are written here by
# hand: title and author.name are the name in _data/profile.json, and description is the first
# sentence of the statement below, in the third person. The home page's title is
# "title | tagline"; every other page's title is "page title | title".
title: Matthias Heinz
tagline: Nuclear physicist
description: >-
  Matthias Heinz studies the structure of atomic nuclei, refining our understanding of strong
  interactions in nature.
url: https://matthiasheinz.com
baseurl: ""
lang: en
timezone: Asia/Tokyo

author:
  name: Matthias Heinz

# Name, position, email, INSPIRE, ORCID, and Google Scholar come from _data/profile.json.
# Not in the CV data: the photo (assets/img/, square, at least 352 x 352 px) and GitHub.
# Leave a value empty ("") to hide it.
photo: /assets/img/portrait.jpg
links:
  github: https://github.com/cheshyre

# The statement under your name on the home page (not in the CV data). If empty (""), the home
# page shows the first two sentences of the research summary (_data/derived.json) instead.
statement: >-
  I study the structure of atomic nuclei, refining our understanding of strong interactions in
  nature. My research connects our understanding of nuclear forces, nuclear structure,
  fundamental symmetries, and nuclear astrophysics using predictive, systematically improvable
  computations.

# Only plugins supported by the github-pages gem.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM

exclude:
  - README.md
  - LICENSE
  - LICENSE-CONTENT.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - scripts/
