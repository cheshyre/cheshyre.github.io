# Site settings. Restart `bundle exec jekyll serve` after editing this file.
# title, description, and author.name are used for page titles and search results; Jekyll
# cannot read them from _data, so they are copied by hand from _data/profile.json.
title: Matthias Heinz
description: Matthias Heinz researches the theoretical description of atomic nuclei.
url: https://matthiasheinz.com
baseurl: ""
lang: en
timezone: Asia/Tokyo

author:
  name: Matthias Heinz

# Name, position, email, INSPIRE, ORCID, and Google Scholar come from _data/profile.json.
# Not in the CV data: the photo (assets/img/, square, at least 352 x 352 px) and GitHub.
# Leave a value empty ("") to hide it.
photo: /assets/img/portrait.jpg
links:
  github: https://github.com/cheshyre

# Only plugins supported by the github-pages gem.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM

exclude:
  - README.md
  - LICENSE
  - LICENSE-CONTENT.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - scripts/
