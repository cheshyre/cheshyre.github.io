<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="site-name" href="{{ '/' | relative_url }}">{{ site.author.name }}</a>
      <nav class="nav" aria-label="Main">
        {%- for item in site.data.nav %}
        <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
        {%- endfor %}
      </nav>
    </div>
  </header>

  <main class="wrap main">
    {{ content }}
  </main>

  <footer class="footer">
    <p class="wrap">Last updated {{ site.time | date: "%B %-d, %Y" }} · Text licensed under <a href="https://creativecommons.org/licenses/by/4.0/" rel="license">CC&nbsp;BY&nbsp;4.0</a></p>
  </footer>
</body>
</html>
